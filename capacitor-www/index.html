<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>OJT.SYS Mobile</title>
    <style>
      :root {
        --accent: #c44900;
        --accent-dark: #9e3b00;
        --bg: #f8fafc;
        --ink: #0f172a;
        --muted: #475569;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 2px solid #e2e8f0;
        border-radius: 24px;
        padding: 28px 24px;
        box-shadow: 0 18px 40px -18px rgba(15, 23, 42, 0.16);
      }
      .badge {
        display: inline-block;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        background: #fff7ed;
        border: 1px solid #fed7aa;
        padding: 4px 10px;
        border-radius: 999px;
      }
      h1 {
        margin: 14px 0 8px;
        font-size: 28px;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 18px;
        font-size: 14px;
        line-height: 1.55;
        color: var(--muted);
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--ink);
      }
      input {
        width: 100%;
        height: 46px;
        padding: 0 14px;
        border-radius: 14px;
        border: 2px solid #e2e8f0;
        font-size: 14px;
        outline: none;
        margin-bottom: 12px;
      }
      input:focus {
        border-color: var(--accent);
      }
      button {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 14px;
        background: var(--accent);
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        background: var(--accent-dark);
      }
      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">OJT.SYS • Android</span>
      <h1>Connect to Workspace</h1>
      <p>
        Enter your deployed OJT.SYS web app URL to launch your mobile punch
        clock, task checklist, and report generator.
      </p>
      <form id="server-form">
        <label for="server-url">Workspace URL</label>
        <input
          id="server-url"
          type="url"
          placeholder="https://ojt-sys.kidlat.workers.dev"
          required
        />
        <button type="submit">Open OJT.SYS</button>
      </form>
      <p class="hint">
        Tip: Set <code>CAPACITOR_SERVER_URL</code> before syncing to bundle your
        production URL directly into the APK.
      </p>
    </main>
    <script>
      (function () {
        var STORAGE_KEY = "ojtsys_server_url";
        var saved = localStorage.getItem(STORAGE_KEY);
        var input = document.getElementById("server-url");
        if (saved && input) {
          input.value = saved;
        }
        document
          .getElementById("server-form")
          .addEventListener("submit", function (e) {
            e.preventDefault();
            var url = (input.value || "").trim().replace(/\/+$/, "");
            if (!url) return;
            localStorage.setItem(STORAGE_KEY, url);
            window.location.href = url + "/dashboard";
          });
      })();
    </script>
  </body>
</html>
